; ESP32 CAN host for the drive.
;
; The ESP32's TWAI controller speaks plain CAN 2.0, so no external CAN
; controller is needed -- only a 3.3 V transceiver such as an SN65HVD230. The
; drive already has one onboard behind J2.
;
;   ESP32 ---- transceiver ---- CANH / CANL ---- drive J2
;
; Terminate at BOTH physical ends with 120 ohm and nowhere else. Powered down,
; CANH-CANL across the whole bus should measure about 60 ohm; 40 ohm means a
; third terminator, which many breakout boards have fitted permanently.
;
; Send 't' on the console to self-test with no transceiver and no peer.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D CAN_TX_PIN=5 -D CAN_RX_PIN=4

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D CAN_TX_PIN=5 -D CAN_RX_PIN=4
