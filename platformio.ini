; BIGTREETECH S42B V2.0 / S57B V2.0 -- STM32F103CBT6 @ 72 MHz
;
; Flashing is SWD only (PA13/PA14 on header P7). There is no USB bootloader.
; BACK UP THE FACTORY FIRMWARE FIRST -- see docs/flashing.md. Per-motor encoder
; calibration lives above 64 KB and is NOT in any published binary.
;
;   pio run -e s57b            build for S57B V2.0
;   pio run -e s42b            build for S42B V2.0
;   pio run -e s57b -t upload  flash (needs a probe on SWD)

[env]
platform      = ststm32
board         = genericSTM32F103CB
framework     = arduino
board_build.f_cpu = 72000000L
upload_protocol = stlink
debug_tool      = stlink
monitor_speed = 38400

; PIN THE CORE. Arduino_Core_STM32 3.0.0 changed enableTimerClock() from
; TIM_HandleTypeDef* to TIM_TypeDef*, and SimpleFOC 2.4.0 still passes the
; handle, so stm32_mcu.cpp fails to compile. 4.21200.0 == core 2.12.0, which
; has the old signature. Revisit when SimpleFOC supports core 3.x.
platform_packages =
    framework-arduinoststm32 @ ~4.21200.0

lib_deps =
    askuric/Simple FOC@2.4.0

build_flags =
    -D SERIAL_UART_INSTANCE=1
    -D PIN_SERIAL_RX=PA10
    -D PIN_SERIAL_TX=PA9

[env:s57b]
build_flags = ${env.build_flags} -D BOARD_S57B_V2

[env:s42b]
build_flags = ${env.build_flags} -D BOARD_S42B_V2
