; USB <-> UART bridge for talking to the drive's P7 console from a PC.
;
; Lets any ESP32 dev board act as a serial adapter for the drive, which is
; handy when you have one to hand and no dedicated USB-TTL cable. The same
; boards carry a TWAI controller, so this is also a sane starting point for a
; CAN host.
;
;   Wiring, ESP32 -> drive header P7:
;       BRIDGE_TX -> RX1
;       BRIDGE_RX <- TX1
;       GND       -> GND
;
; Both ends are 3.3 V, so no level shifting. Open the ESP32's port at 115200;
; everything is relayed to the drive at 38400 and back.
;
;   pio run -e esp32   -t upload      classic ESP32 (CP2102 boards, BR/EDR + BLE)
;   pio run -e esp32s3 -t upload      ESP32-S3 (CH343 boards, BLE only)

[env]
framework = arduino
platform = espressif32
monitor_speed = 115200

[env:esp32]
board = esp32dev
; GPIO17/16 are the hardware UART2 pins on a classic ESP32 and are free on
; boards without PSRAM. Change them here if your board uses them for something.
build_flags = -D BRIDGE_TX=17 -D BRIDGE_RX=16 -D DRIVE_BAUD=38400

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = -D BRIDGE_TX=17 -D BRIDGE_RX=18 -D DRIVE_BAUD=38400
